name: Owner Migration Backend Checks

on:
  workflow_dispatch:
  push:
    branches:
      - vs-4-owner-migration
    paths:
      - 'functions/**'
      - 'app/**'
      - '.github/workflows/owner-migration-checks.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check owner-device module syntax
        run: node --check functions/ownerDevices.js

      - name: Check Cloud Functions entry point syntax
        run: node --check functions/index.js

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Android debug APK
        run: gradle assembleDebug

      - name: Run Android local unit tests
        run: gradle testDebugUnitTest

  android-device-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run backup tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: gradle connectedDebugAndroidTest
