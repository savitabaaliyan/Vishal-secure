plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def stableStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def stableStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def stableKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def stableKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasStableSigning = [stableStorePath, stableStorePassword, stableKeyAlias, stableKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.vishalsecure.app'
    compileSdk 35

    signingConfigs {
        stableDebug {
            if (hasStableSigning) {
                storeFile file(stableStorePath)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasStableSigning) {
                signingConfig signingConfigs.stableDebug
            }
        }
    }

    defaultConfig {
        applicationId 'com.vishalsecure.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    // Ensure Firebase Auth has the ContextCompat.registerReceiver overload it calls.
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
